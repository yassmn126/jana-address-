    Алмагуль:   {district: Бостандыкский}
    Казахфильм: {district: Бостандыкский}
    Самал:      {district: Медеуский, verify: true}          # Самал-1/2; Самал-3 may differ
    Айнабулак:  {district: Жетысуский}
    Шанырак:    {district: Алатауский}
    Алгабас:    {district: Алатауский}
    Нуркент:    {district: Алатауский}
    Зердели:    {district: Алатауский, verify: true}
    Тастак:     {district: Алмалинский, verify: true}
    Калкаман:   {district: Наурызбайский, verify: true}
  Караганда:
