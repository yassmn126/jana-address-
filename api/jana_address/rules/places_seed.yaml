# City districts (городские районы). Used to (1) recognize district names in strings,
# (2) resolve city from a district when the city is missing, (3) seed the ETL.
city_districts:
  Алматы:   [Алатауский, Алмалинский, Ауэзовский, Бостандыкский, Жетысуский, Медеуский, Наурызбайский, Турксибский]
  Астана:   [Алматы, Байконур, Есиль, Нура, Сарыарка]          # Нура added 2024 — verify
  Шымкент:  [Абайский, Аль-Фарабийский, Енбекшинский, Каратауский, Туран]
  Караганда: [Казыбек би, Октябрьский]                        # «район имени Казыбек би»
# Kazakh forms of city districts (string may contain them)
city_districts_kk:
  Алматы:   {Алатау: Алатауский, Алмалы: Алмалинский, Әуезов: Ауэзовский, Ауэзов: Ауэзовский, Бостандық: Бостандыкский,
             Жетісу: Жетысуский, Медеу: Медеуский, Наурызбай: Наурызбайский, Түрксіб: Турксибский}
  Астана:   {Алматы: Алматы, Байқоңыр: Байконур, Есіл: Есиль, Нұра: Нура, Сарыарқа: Сарыарка}
  Шымкент:  {Абай: Абайский, Әл-Фараби: Аль-Фарабийский, Еңбекші: Енбекшинский, Қаратау: Каратауский, Тұран: Туран}

# Microdistrict → city district (Almaty). SEED ONLY — the ETL replaces this with
# OSM place polygons joined to district boundaries. Numbered variants ("Аксай-3а")
# are matched by the base name.
microdistricts:
  Алматы:
    Аксай:      {district: Ауэзовский}
    Жетысу:     {district: Ауэзовский}
    Мамыр:      {district: Ауэзовский}
