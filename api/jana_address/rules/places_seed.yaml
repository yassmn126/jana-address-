# SEED gazetteer. Purpose: make the rule grammar useful on day 0 and define the
# interface the real gazetteer (OSM + KATO ETL → gazetteer.sqlite) must implement.
# Everything here must be re-verified against KATO/OSM by the ETL; entries marked
# `verify: true` are from memory and may be wrong.
#
# `name` is the Russian name as it appears in Jana Post strings; `kk` the Kazakh name;
# `aliases` are other spellings (old names, Latin, typos) — all matched on the matching view.

cities:
