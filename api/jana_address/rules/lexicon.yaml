# Keyword lexicon for the rule grammar. All variants are matched on the normalized
# token (lowercase, ё→е, trailing dots stripped). Latin keywords stay Latin.
# Keep this file boring and exhaustive: every new typo seen in train.json goes here.

# ---- settlement / admin keywords -------------------------------------------
city_kw:        [город, г, гор, пос, поселок, посёлок, п-к, пгт, село, с, аул, а, ауыл, ауылы,
                 қаласы, каласы, қ, қала, кала, кенті, кент, станция, ст, разъезд, деревня, с/о, сельский]
# Kazakh suffix words that FOLLOW the name: "Ақтөбе қаласы", "Боралдай ауылы"
city_suffix_kk: [қаласы, каласы, ауылы, кенті, кенти, ауданы]
province_kw:    [область, обл, облысы, облысында, region, obl]
district_kw:    [район, р-н, р/н, рн, района, районе, ауданы, аудан, district]

# ---- street types: canonical lemma -> variants ------------------------------
street_types:
  улица:        [ул, у, улица, улицы, улице, ulitsa, ulica, ul, str, street, көшесі, кошеси, көш, кош, к-сі,
                 ulitsa., улиц, улца, улиа, уица, улицца]
  проспект:     [пр, пр-т, пр-кт, пркт, просп, проспект, проспекта, проспекте, prospekt, prospect, pr, ave,
                 даңғылы, дангылы, даңғ, данг]
  микрорайон:   [мкр, мкр-н, мкрн, м-н, мк, мкн, микр, микрорайон, микрорайона, микрорайоне, микроаудан,
                 микроауданы, мкр-он, мкро, mkr, mikroraion, microdistrict, микр-н, м/р, м-р,
                 ықшамаудан, ықшамауданы, шағынаудан, шағынауданы, ш/а, ы/а, ыкшамаудан]
  переулок:     [пер, переулок, переулка, пер-к, lane]
  квартал:      [кв-л, квартал, квартала, кварт, квл, kvartal, орам, орамы]
  бульвар:      [бул, б-р, бульвар, бульвара, blvd, boulevard, гүлзар, гүлзары]
  шоссе:        [ш, шоссе, highway]
  проезд:       [пр-д, проезд, проезда, өткелі, өтпесі]
  тупик:        [туп, тупик, тұйығы, туйыгы]
  площадь:      [пл, площадь, алаңы, аланы]
  аллея:        [аллея, аллеясы]
  тракт:        [тракт, тракта]
  набережная:   [наб, набережная, жағалауы]
  жилой массив: [ж/м, жм, жилмассив, жил-массив]
  дорога:       [дорога, трасса, road]            # «жолы» removed: «Жібек жолы» is a street NAME
  линия:        [линия]
  разъезд:      []
# which types locate like a microdistrict (the number can be part of the NAME)
microdistrict_like: [микрорайон, квартал, жилой массив]
# multi-word types: first word -> second word -> lemma  (Kazakh «ықшам аудан» = микрорайон)
street_type_bigrams:
  жилой:   {массив: "жилой массив", комплекс: "ЖК"}
  жил:     {массив: "жилой массив"}
  ықшам:   {аудан: "микрорайон", ауданы: "микрорайон"}
  шағын:   {аудан: "микрорайон", ауданы: "микрорайон"}
  тұрғын:  {үй: "ЖК"}
  тас:     {жолы: "шоссе"}
# Kazakh ordinal suffixes written after a number: «11-ші ықшам аудан», «3-ші қабат», «5-інші кіреберіс»
ordinal_suffix:  [ші, шы, нші, ншы, інші, ыншы, й, ый, ой, ий, ая, я, го, ого, ом]

# ---- living area (ЖК / residential complex) ---------------------------------
living_kw:      [жк, ж/к, жилкомплекс, түк, тук, residence, резиденс, комплекс, кешені]

# ---- house / details -------------------------------------------------------
house_kw:       [дом, д, дома, доме, уй, үй, dom, d, house, h, зд, здание, участок, уч]
# «12 корпус 2» → house «12/2» (team decision Q7, docs/CONVENTIONS.md); see conventions.yaml
building_kw:    [корпус, корп, кор, к, блок, бл, литер, лит, строение, стр, ғимарат]
apartment_kw:   [кв, квартира, квартиры, квартире, квар, пәтер, патер, пәт, kv, kvartira, flat, apt, apartment,
                 ап, апп, оф, офис, office, каб, кабинет, квратира, кваритра, квартра, кварт]
entrance_kw:    [подъезд, подьезд, подезд, подъезда, под, п-д, пд, кіреберіс, кіреберісі, кір, entrance, ent,
                 парадная, падъезд, подъзд, подъез, подезда]        # «вход» removed: «вход со двора» is noise
floor_kw:       [этаж, этаже, эт, қабат, кабат, floor, fl]
# "п" alone is ambiguous: п. Боралдай (поселок) / 5 п (подъезд) / 12 п (пәтер, Kazakh apartment).
ambiguous_p:    [п]

# ---- landmarks --------------------------------------------------------------
landmark_kw:    [магазин, маг, тц, трц, тд, бц, рынок, базар, школа, детсад, садик, больница, поликлиника,
                 аптека, остановка, ост, мечеть, церковь, вокзал, автовокзал, аэропорт, гостиница, отель,
                 кафе, ресторан, банк, супермаркет, сто, азс, заправка, парк, сквер, стадион, дворец, дк,
                 университет, универ, колледж, лицей, гимназия, роддом, цон, акимат, суд, почта, почтамт,
                 отделение, пункт, пвз, склад, завод, фабрика, рынка, маркет, ларек, киоск, салон, офис-центр,
                 ориентир, напротив, рядом, возле, около, за, перед, угол, уг, пересечение, перекресток,
                 qazpost, казпочта, казпошта, kaspi, каспи, magnum, магнум, small, смолл, анвар, anvar,
                 рамстор, mega, мега, dostyk, достык-плаза, галмарт, galmart, арзан, arzan, cdek, сдэк,
                 ozon, озон, wildberries, вайлдберриз, wb, озон-пункт]
# words after which the landmark VALUE starts (the marker itself is not part of the value)
landmark_marker_only: [ориентир, напротив, рядом, возле, около, за, перед]

# ---- noise / stopwords (never part of a value) -------------------------------
noise:          [респ, республика, казахстан, рк, kazakhstan, kz, адрес, адреса, индекс, и, в, на, по, с, от,
                 до, же, тел, телефон, доставка, самовывоз, получатель, получателя, получателю, уточнить, оставить,
                 дверь, двери, у, к, the, ип, тоо, ао, оао, зао, фио, заказ, заказчик, курьер, курьеру, позвонить,
                 звонить, предварительно, заранее, вход, со, двора, бутик, павильон, место, этажность]
