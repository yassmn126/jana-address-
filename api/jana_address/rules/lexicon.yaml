# which types locate like a microdistrict (the number can be part of the NAME)
microdistrict_like: [микрорайон, квартал, жилой массив]
# multi-word types: first word -> second word -> lemma  (Kazakh «ықшам аудан» = микрорайон)
street_type_bigrams:
  жилой:   {массив: "жилой массив", комплекс: "ЖК"}
  жил:     {массив: "жилой массив"}
  ықшам:   {аудан: "микрорайон", ауданы: "микрорайон", ауданда: "микрорайон", ауданында: "микрорайон", ауданындағы: "микрорайон"}
  шағын:   {аудан: "микрорайон", ауданы: "микрорайон", ауданда: "микрорайон", ауданында: "микрорайон", ауданындағы: "микрорайон"}
  shagyn:  {audan: "микрорайон", audany: "микрорайон", audanda: "микрорайон", audanynda: "микрорайон", audanyndagy: "микрорайон"}
  yqsham:  {audan: "микрорайон", audany: "микрорайон", audanda: "микрорайон", audanynda: "микрорайон", audanyndagy: "микрорайон"}
  yksham:  {audan: "микрорайон", audany: "микрорайон", audanda: "микрорайон", audanynda: "микрорайон", audanyndagy: "микрорайон"}
  дачный:  {массив: "ЖК"}
  dacha:   {massiv: "ЖК"}
  садовое: {товарищество: "ЖК"}
  бау-бақша: {серіктестігі: "ЖК"}
  тұрғын:  {үй: "ЖК"}
  тас:     {жолы: "шоссе"}
# Kazakh ordinal suffixes written after a number: «11-ші ықшам аудан», «3-ші қабат», «5-інші кіреберіс»
ordinal_suffix:  [ші, шы, нші, ншы, інші, ыншы, й, ый, ой, ий, ая, я, го, ого, ом, th, nd, rd]

