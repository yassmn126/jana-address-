               южно-казахстанская, юко, южно казахстанская, turkestan region, turkistan region]
  - canonical: "область Абай"          # OPEN QUESTION — alt: "Абайская область"
    kk: "Абай облысы"
    center: "Семей"
    variants: [область абай, абай облысы, абайская, абайская область, абайская обл, abai region, abay region]
  - canonical: "область Жетісу"        # OPEN QUESTION — alt: "Жетысуская область"
    kk: "Жетісу облысы"
    center: "Талдыкорган"
    variants: [область жетісу, область жетысу, жетісу облысы, жетысу облысы, жетысуская, жетысуская область,
               жетисуская, жетысу обл, zhetysu region]
  - canonical: "область Ұлытау"        # OPEN QUESTION — alt: "Улытауская область"
    kk: "Ұлытау облысы"
    center: "Жезказган"
    variants: [область ұлытау, область улытау, ұлытау облысы, улытау облысы, улытауская, улытауская область,
               ulytau region]
  # cities of republican significance: province == city name
  - canonical: "Астана"
    kk: "Астана"
    center: "Астана"
    city: true
    variants: [астана, astana, нур-султан, нур султан, нурсултан, nur-sultan, nursultan, целиноград, акмола г, астана қаласы, астана каласы]
  - canonical: "Алматы"
    kk: "Алматы"
    center: "Алматы"
    city: true
    variants: [алматы, almaty, алма-ата, алмата, алматы қаласы, алматы каласы, алмаата]
  - canonical: "Шымкент"
    kk: "Шымкент"
    center: "Шымкент"
    city: true
    variants: [шымкент, shymkent, чимкент, шымкент қаласы, шымкент каласы]
