# Canonical province names (the ONLY normalized name field in the output).
# Brief, slide 8: «Название в прямом порядке: "Актюбинская область", "Алматы" для городов респ. значения».
#
# `canonical` is what we output. `variants` are matched on the matching view
# (lowercase, ё→е, Latin lookalikes folded, dots removed). Adjective variants match
# with or without a following «область/обл». `kk` is the Kazakh name (matches "X облысы").
#
# OPEN QUESTION (ask organizers): the three 2022 regions are officially «область Абай»,
# «область Жетісу», «область Ұлытау» in Russian — not adjective-first. Jana Post's DB may
# use the colloquial «Абайская область» etc. Flip `canonical` here once confirmed.

provinces:
  - canonical: "Акмолинская область"
    kk: "Ақмола облысы"
    center: "Кокшетау"
    variants: [акмолинская, акмолинская область, акмолинская обл, акмола облысы, ақмола облысы, akmola region]
  - canonical: "Актюбинская область"
    kk: "Ақтөбе облысы"
    center: "Актобе"
    variants: [актюбинская, актюбинская область, актюбинская обл, актобе облысы, ақтөбе облысы, актюбинск обл, aktobe region]
  - canonical: "Алматинская область"
    kk: "Алматы облысы"
    center: "Конаев"
    variants: [алматинская, алматинская область, алматинская обл, алматы облысы, almaty region, almaty oblast]
  - canonical: "Атырауская область"
    kk: "Атырау облысы"
    center: "Атырау"
    variants: [атырауская, атырауская область, атырауская обл, атырау облысы, atyrau region]
  - canonical: "Восточно-Казахстанская область"
    kk: "Шығыс Қазақстан облысы"
    center: "Усть-Каменогорск"
    variants: [восточно-казахстанская, восточно-казахстанская область, восточно казахстанская, вко, в-к-о,
               шығыс қазақстан облысы, шығыс қазақстан, шыгыс казакстан, east kazakhstan, вост-казахстанская, вост казахстанская]
  - canonical: "Жамбылская область"
    kk: "Жамбыл облысы"
    center: "Тараз"
    variants: [жамбылская, жамбылская область, жамбылская обл, жамбыл облысы, zhambyl region, джамбулская]
  - canonical: "Западно-Казахстанская область"
