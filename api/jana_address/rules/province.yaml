    center: "Уральск"
    variants: [западно-казахстанская, западно-казахстанская область, западно казахстанская, зко, батыс қазақстан облысы,
               батыс қазақстан, батыс казакстан, west kazakhstan, зап-казахстанская, зап казахстанская]
  - canonical: "Карагандинская область"
    kk: "Қарағанды облысы"
    center: "Караганда"
    variants: [карагандинская, карагандинская область, карагандинская обл, караганды облысы, қарағанды облысы, karaganda region]
  - canonical: "Костанайская область"
